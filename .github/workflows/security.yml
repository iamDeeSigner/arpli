name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * *' # 06:27 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    # Daily and on main: vulnerabilities get published against code that has
    # not changed, so this has to run on a schedule, not only on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Full audit (report only)
        run: |
          {
            echo '## npm audit (all dependencies)'
            echo '```'
            npm audit --package-lock-only || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on high or critical issues in shipped dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    # Fails a PR that brings in a new high or critical advisory in shipped
    # dependencies. Compares against the base branch, so advisories already on
    # main are reported by the daily audit instead of blocking every PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare advisories with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          advisories() {
            (cd "$1" && npm audit --package-lock-only --omit=dev --json || true) |
              jq -r '[.vulnerabilities[] | .via[] | objects
                      | select(.severity == "high" or .severity == "critical")
                      | "\(.name) \(.url)"] | unique[]'
          }
          git worktree add -q "$RUNNER_TEMP/base" "$BASE_SHA"
          advisories "$RUNNER_TEMP/base" > "$RUNNER_TEMP/base.txt"
          advisories . > "$RUNNER_TEMP/head.txt"
          new=$(comm -13 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt")
          if [ -n "$new" ]; then
            echo "This PR adds high or critical advisories in shipped dependencies:"
            echo "$new"
            exit 1
          fi
          echo "No new high or critical advisories."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
