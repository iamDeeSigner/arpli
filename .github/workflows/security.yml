name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * *' # 06:27 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    # Daily and on main: vulnerabilities get published against code that has
    # not changed, so this has to run on a schedule, not only on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full audit (report only)
        run: |
          {
            echo '## npm audit (all dependencies)'
            echo '```'
            npm audit --package-lock-only || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on high or critical issues in shipped dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    # Blocks a PR that adds a dependency with a known high or critical issue.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
